<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>接続テスト</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body style="font-family:sans-serif;padding:40px;max-width:480px;margin:0 auto;">
<h2>🔍 接続テスト</h2>
<div id="result" style="margin-top:20px;padding:16px;border-radius:10px;background:#f5f5f5;">
  チェック中...
</div>
<script>
var r = document.getElementById("result");
var lines = [];

// 1. Firebase SDKチェック
if(typeof firebase !== “undefined”) {
lines.push(“✅ Firebase SDK: 読み込み成功”);
} else {
lines.push(“❌ Firebase SDK: 読み込み失敗”);
}

// 2. 初期化テスト
try {
firebase.initializeApp({
apiKey: “AIzaSyAc4RN6JR3DZd0d3EabrjgqT8t6ZOZQtMI”,
authDomain: “tabinote-40a95.firebaseapp.com”,
projectId: “tabinote-40a95”
});
lines.push(“✅ Firebase初期化: 成功”);
} catch(e) {
lines.push(“⚠️ Firebase初期化: “ + e.message);
}

// 3. Auth チェック
try {
var auth = firebase.auth();
lines.push(“✅ Auth: 利用可能”);
} catch(e) {
lines.push(“❌ Auth: “ + e.message);
}

// 4. ネットワーク確認
fetch(“https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js”, {method:“HEAD”})
.then(function(res){ lines.push(“✅ gstatic.com: 接続OK (”+res.status+”)”); update(); })
.catch(function(e){ lines.push(“❌ gstatic.com: 接続失敗 - “+e.message); update(); });

function update() {
r.innerHTML = lines.map(function(l){
return ‘<div style="margin-bottom:8px;font-size:14px;">’+l+’</div>’;
}).join(””);
}
update();
</script>

</body>
</html>
