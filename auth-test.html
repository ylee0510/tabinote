<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Auth Test</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body style="font-family:sans-serif;padding:40px;max-width:480px;margin:0 auto">
<h2>🔐 Auth Test</h2>
<div id="status" style="padding:16px;background:#f5f5f5;border-radius:10px;margin:16px 0;font-size:14px">確認中...</div>
<button id="btn" onclick="login()" style="padding:14px 24px;background:#1c1917;color:#fff;border:none;border-radius:12px;font-size:15px;cursor:pointer;width:100%">Googleでログイン</button>
<div id="log" style="margin-top:16px;font-size:12px;color:#666;white-space:pre-wrap"></div>

<script>
var log = document.getElementById('log');
var status = document.getElementById('status');

function addLog(msg) {
  log.textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n';
}

var FB_CONFIG = {
  apiKey: "AIzaSyAc4RN6JR3DZd0d3EabrjgqT8t6ZOZQtMI",
  authDomain: "tabinote-40a95.firebaseapp.com",
  projectId: "tabinote-40a95"
};

firebase.initializeApp(FB_CONFIG);
var auth = firebase.auth();

// iOSのPWAでセッションを維持するためLOCAL永続化を明示
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(function() {
  addLog('Firebase initialized (persistence: LOCAL)');
}).catch(function(e) {
  addLog('persistence error: ' + e.message);
});

addLog('Firebase initialized');

// Redirectは使わないのでgetRedirectResultは念のため確認のみ
auth.getRedirectResult().then(function(result) {
  if (result && result.user) {
    addLog('getRedirectResult: ' + result.user.email);
  } else {
    addLog('getRedirectResult: no user');
  }
}).catch(function(e) {
  addLog('getRedirectResult error: ' + e.code);
});

auth.onAuthStateChanged(function(u) {
  if (u) {
    addLog('onAuthStateChanged: ' + u.email);
    status.style.background = '#dcfce7';
    status.textContent = '✅ ログイン済み: ' + u.email;
    document.getElementById('btn').textContent = 'ログアウト';
    document.getElementById('btn').onclick = function() { auth.signOut(); };
  } else {
    addLog('onAuthStateChanged: null (not logged in)');
    status.style.background = '#fee2e2';
    status.textContent = '❌ 未ログイン';
    document.getElementById('btn').textContent = 'Googleでログイン';
    document.getElementById('btn').onclick = login;
  }
});

function login() {
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt: 'select_account'});
  addLog('signInWithPopup 開始...');

  auth.signInWithPopup(provider).then(function(result) {
    addLog('popup success: ' + result.user.email);
  }).catch(function(e) {
    addLog('popup error: ' + e.code + ' / ' + e.message);

    // popupがブロックされた場合のみredirectにフォールバック
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/cancelled-popup-request') {
      addLog('fallback: signInWithRedirect に切り替え');
      auth.signInWithRedirect(provider).catch(function(e2) {
        addLog('redirect error: ' + e2.message);
      });
    }
  });
}
</script>

</body>
</html>
