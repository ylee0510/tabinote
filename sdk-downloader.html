<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>たびノート SDK取得</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic Pro','Noto Sans JP',sans-serif;max-width:480px;margin:0 auto;padding:20px;background:#f5f2ed;min-height:100vh;}
h2{color:#1c1917;margin-bottom:8px;font-size:22px;}
.desc{font-size:13px;color:#78716c;margin-bottom:20px;line-height:1.6;}
.step{background:#fff;border:1px solid #e2ddd6;border-radius:14px;padding:16px;margin-bottom:12px;}
.step-num{display:inline-block;background:#c2541a;color:#fff;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-weight:700;font-size:13px;margin-right:8px;}
.step-title{font-size:15px;font-weight:700;color:#1c1917;margin-bottom:8px;display:flex;align-items:center;}
.step-body{font-size:13px;color:#444;line-height:1.7;}
.btn{background:#c2541a;color:#fff;border:none;border-radius:12px;padding:14px 24px;font-size:15px;cursor:pointer;width:100%;font-weight:700;font-family:inherit;margin-top:10px;}
.btn:disabled{opacity:0.6;}
.btn.done{background:#4a7c59;}
.fname{font-family:monospace;background:#ede9e3;padding:2px 6px;border-radius:4px;font-size:12px;}
.status{padding:10px 12px;border-radius:8px;font-size:13px;margin-top:8px;line-height:1.5;}
.ok{background:#dcfce7;color:#166534;}
.err{background:#fee2e2;color:#c2541a;}
.wait{background:#fef3c7;color:#92400e;}
.note{background:#dbeafe;border:1px solid #1d4ed8;color:#1e3a8a;border-radius:14px;padding:16px;font-size:13px;line-height:1.7;}
</style>
</head>
<body>
<h2>⚙️ SDKファイル取得ツール</h2>
<p class="desc">たびノートを動かすためのFirebase SDKを取得します。<br>各ボタンを順にタップして3つのファイルをダウンロードしてください。</p>

<div id="files"></div>

<div class="note">
<b>📌 ダウンロード後の手順</b><br><br>
3つすべてダウンロードしたら：<br>
1. GitHubの tabinote リポジトリを開く<br>
2. <b>Add file → Upload files</b><br>
3. 「ファイル」アプリから3つのJSファイルをアップロード<br>
4. <b>Commit changes</b>
</div>

<script>
const files = [
  {name:'firebase-app.js', url:'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js'},
  {name:'firebase-auth.js', url:'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js'},
  {name:'firebase-firestore.js', url:'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js'},
];

const container = document.getElementById('files');
files.forEach((f, idx) => {
  const div = document.createElement('div');
  div.className = 'step';
  div.innerHTML = `
    <div class="step-title"><span class="step-num">${idx+1}</span><span class="fname">${f.name}</span></div>
    <div class="step-body">タップしてダウンロード</div>
    <button class="btn" id="btn-${idx}">ダウンロード</button>
    <div id="status-${idx}"></div>
  `;
  container.appendChild(div);
  const btn = div.querySelector(`#btn-${idx}`);
  const status = div.querySelector(`#status-${idx}`);
  btn.onclick = async () => {
    btn.disabled = true;
    status.className = 'status wait';
    status.textContent = '⏳ ダウンロード中...';
    try {
      const r = await fetch(f.url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      const blob = new Blob([text], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = f.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      status.className = 'status ok';
      status.innerHTML = '✅ ダウンロード開始（' + Math.round(text.length/1024) + 'KB）<br>「ファイル」アプリの「ダウンロード」フォルダに保存されます';
      btn.classList.add('done');
      btn.textContent = '✓ 完了';
    } catch(e) {
      status.className = 'status err';
      status.textContent = '❌ 失敗: ' + e.message;
      btn.disabled = false;
    }
  };
});
</script>

</body>
</html>
