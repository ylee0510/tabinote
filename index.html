async function geocode(q){

// ── Map ──
function initMap(){
var el=document.getElementById(“leaflet-map”);
if(!el||mapInst||!window.L)return;
mapInst=L.map(el).setView([35.6762,139.6503],5);
L.tileLayer(“https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png”,{attribution:“© OpenStreetMap”}).addTo(mapInst);

syncMarkers();
}
function destroyMap(){if(mapInst){mapInst.remove();mapInst=null;mapMarkers=[];}}
function syncMarkers(){
if(!mapInst||!window.L)return;
var sel=getSel();var spots=sel?sel.places||[]:[];
mapMarkers.forEach(function(m){m.remove();});mapMarkers=[];
spots.forEach(function(s,i){
if(!s.lat||!s.lng)return;
var ic=L.divIcon({className:””,html:’<div style="background:#c2541a;color:#fff;border-radius:50% 50% 50% 0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);transform:rotate(-45deg)"><span style="transform:rotate(45deg)">’+(i+1)+’</span></div>’,iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-28]});
var m=L.marker([s.lat,s.lng],{icon:ic}).addTo(mapInst);
m.bindPopup(”<b>”+(i+1)+”. “+s.name+”</b>”+(s.memo?”<br><small>”+s.memo+”</small>”:””));
mapMarkers.push(m);
});
if(spots.some(function(s){return s.lat;})){var v=spots.filter(function(s){return s.lat;});mapInst.fitBounds(L.latLngBounds(v.map(function(s){return[s.lat,s.lng];})),{padding:[40,40],maxZoom:14});}

// ── Boot ──
function loadScript(src,cb){
var done=false;
function finish(){if(!done){done=true;cb();}}
var s=document.createElement(“script”);
s.src=src;
s.onload=finish;
s.onerror=function(){console.error(“Failed:”,src);finish();};
// timeout fallback: 8 seconds
setTimeout(finish,8000);
document.head.appendChild(s);
}

// Load script via fetch+eval to bypass MIME type issues
function loadScriptFetchEval(url, cb){
fetch(url)
.then(function(r){
if(!r.ok) throw new Error(“HTTP “+r.status);
return r.text();
})
.then(function(code){
var s = document.createElement(“script”);
s.textContent = code;
document.head.appendChild(s);
cb(true);
})
.catch(function(e){
console.warn(“fetchEval failed:”, url, e);
cb(false);
});
}

// Load script tag (for same-origin or CORS-enabled)
function loadScriptTag(url, cb){
var done=false;
function finish(ok){if(!done){done=true;cb(ok);}}
var s=document.createElement(“script”);
s.src=url;
s.onload=function(){finish(true);};
s.onerror=function(){finish(false);};
setTimeout(function(){finish(false);}, 15000);
document.head.appendChild(s);
}

// Try local first (fetch+eval), then CDN tag
function loadScriptWithFallback(local, cdn, cb){
loadScriptFetchEval(local, function(ok){
if(ok){ console.log(“OK (fetch):”, local); cb(); return; }
console.log(“Trying CDN tag:”, cdn);
loadScriptTag(cdn, function(ok2){
if(ok2){ console.log(“OK (cdn):”, cdn); }
else { console.error(“FAILED:”, cdn); }
cb();
});
});
}
