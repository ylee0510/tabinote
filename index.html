<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#ffffff;--paper:#ffffff;--ink:#1c1917;--muted:#78716c;--border:#e4e4e7;--accent:#2d3e5a;--green:#4a7c59;--stamp:#f4f4f5;}
body{font-family:'Hiragino Kaku Gothic Pro','Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;}
#app{max-width:480px;margin:0 auto;min-height:100vh;}
@media(min-width:768px){
  #app{max-width:1024px;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .pc-layout{display:flex;flex:1;min-height:0;overflow:hidden;}
  .sidebar{width:220px;min-width:220px;background:#2d3e5a;display:flex;flex-direction:column;overflow-y:auto;}
  .sidebar::-webkit-scrollbar{display:none;}
  .sidebar-hdr{padding:16px 12px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.1);}
  .sidebar-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.45);}
  .sidebar-add-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;width:26px;height:26px;border-radius:6px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .sidebar-trips{flex:1;padding:8px 8px 0;}
  .sidebar-trip{padding:9px 10px;border-radius:9px;cursor:pointer;margin-bottom:3px;}
  .sidebar-trip:hover{background:rgba(255,255,255,0.08);}
  .sidebar-trip.active{background:rgba(255,255,255,0.18);}
  .sidebar-trip-name{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar-trip-dates{font-size:10px;color:rgba(255,255,255,0.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar-footer{padding:10px 12px 16px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto;}
  .sidebar-new-btn{width:100%;background:rgba(255,255,255,0.1);border:none;color:rgba(255,255,255,0.7);padding:9px 12px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;text-align:left;font-family:inherit;}
  .sidebar-new-btn:hover{background:rgba(255,255,255,0.18);}
  .app-wrap{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
  .main-area{flex:1;min-width:0;overflow-y:auto;}
  .welcome-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:10px;}
  .welcome-icon{font-size:44px;opacity:0.4;}
  .welcome-text{font-size:14px;}
  .pc-hide-back .back-btn{display:none;}
}
.page-login{background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;}
.page-loading{background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#1c1917;border:1.5px solid #1c1917;border-radius:14px;padding:15px 28px;font-size:15px;font-weight:700;cursor:pointer;width:100%;max-width:300px;}
.hdr{background:#fff;color:#1c1917;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid #e2ddd6;}
.hdr-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.hdr-r{display:flex;gap:8px;flex-shrink:0;}
.back-btn{background:#fff;border:none;color:#1c1917;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.hdr-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1c1917;}
.hdr-sub{font-size:10px;color:#a8a29e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.icon-btn2{background:#fff;border:none;color:#1c1917;width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn2.on{background:var(--accent);color:#fff;}
.add-btn2{background:var(--accent);border:none;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;}
.menu-btn{background:#fff;border:1px solid var(--border);color:#1c1917;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.trip-list{padding:16px;display:flex;flex-direction:column;gap:12px;}
.trip-card{background:var(--paper);border-radius:16px;padding:0;border:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;}
.trip-card-body{padding:12px 14px 12px;}
.trip-nm{font-size:18px;font-weight:800;color:#1c1917;padding-right:28px;}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.badge-os{background:#dbeafe;color:#1d4ed8;}
.badge-dm{background:#dcfce7;color:#166534;}
.badge-sh{background:#fef3c7;color:#92400e;}
.pill{background:var(--accent);color:#fff !important;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
.chip{background:var(--stamp);border-radius:8px;padding:3px 9px;font-size:11px;color:var(--muted);font-weight:600;}
.tabs{display:flex;background:var(--paper);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;font-size:10px;font-weight:600;color:var(--muted);}
.tab.on{color:#1c1917;border-bottom-color:var(--accent);}
.tab-ic{display:flex;align-items:center;justify-content:center;height:22px;}
.tab-n{background:var(--stamp);color:var(--muted);font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;}
.tab.on .tab-n{background:var(--accent);color:#fff;}
.content{padding:16px;}
.form-box{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px;}
.row{display:flex;gap:8px;margin-bottom:8px;}
.inp{flex:1;padding:11px 13px;background:var(--paper);border:1.5px solid var(--border);border-radius:11px;font-size:15px;color:#1c1917;outline:none;font-family:inherit;-webkit-appearance:none;width:100%;}
.inp:focus{border-color:var(--accent);}
.plus-btn{padding:11px 15px;background:var(--accent);color:#fff;border:none;border-radius:11px;font-size:19px;cursor:pointer;flex-shrink:0;}
.plus-btn:disabled{opacity:0.5;}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;}
.prog-bg{background:var(--border);border-radius:4px;height:4px;margin-bottom:14px;overflow:hidden;}
.prog-fill{height:100%;background:var(--green);border-radius:4px;transition:width 0.4s;}
.item{background:var(--paper);border:1px solid var(--border);border-radius:11px;padding:12px 11px;margin-bottom:8px;display:flex;align-items:center;gap:9px;}
.item.done{opacity:0.45;}
.chk{width:25px;height:25px;border-radius:7px;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;transition:all 0.15s;}
.chk.on{background:var(--green);border-color:var(--green);}
.item-txt{flex:1;font-size:15px;color:#1c1917;line-height:1.4;}
.item-txt.done{text-decoration:line-through;color:var(--muted);}
.del-btn{background:var(--stamp);border:none;cursor:pointer;font-size:13px;padding:5px 7px;border-radius:7px;flex-shrink:0;}
.tpl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0.5;margin-right:5px;vertical-align:middle;}
.empty{text-align:center;padding:44px 16px;color:var(--muted);}
.empty-ic{font-size:34px;margin-bottom:10px;opacity:0.5;}
.empty-tx{font-size:13px;line-height:1.7;}
.date-hdr{font-size:13px;font-weight:800;color:#1c1917;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.date-hdr::before{content:'';display:inline-block;width:4px;height:15px;background:var(--accent);border-radius:2px;}
.itin-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.itin-time{font-size:13px;font-weight:700;color:var(--accent);width:44px;flex-shrink:0;padding-top:1px;}
.itin-tl{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0;padding-top:3px;}
.itin-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.itin-line{width:2px;flex:1;min-height:14px;background:var(--border);}
.itin-tx{flex:1;font-size:14px;color:#1c1917;line-height:1.5;}
.itin-type-badge{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:1px 6px;margin-right:5px;vertical-align:middle;}
.place-num{width:25px;height:25px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.place-move{background:#fff;border:1px solid var(--border);border-radius:6px;width:26px;height:20px;font-size:9px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;font-family:inherit;}
.place-move:disabled{opacity:0.3;cursor:default;}
.place-move:not(:disabled):active{background:#f4f4f5;}
.type-row{display:flex;gap:8px;margin-bottom:12px;}
.type-btn{flex:1;padding:9px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:var(--paper);color:var(--muted);font-family:inherit;}
.type-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;z-index:100;backdrop-filter:blur(2px);}
.modal{background:var(--paper);border-radius:22px 22px 0 0;padding:22px 18px 44px;width:100%;max-width:480px;margin:0 auto;max-height:92vh;overflow-y:auto;animation:up 0.22s ease;}
@keyframes up{from{transform:translateY(50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-bar{width:34px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 18px;}
.modal-title{font-size:17px;font-weight:800;color:#1c1917;margin-bottom:16px;}
.lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block;}
.fg{margin-bottom:11px;}
.finp{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;color:#1c1917;background:#fff;outline:none;font-family:inherit;-webkit-appearance:none;}
.finp:focus{border-color:var(--accent);}
.modal-acts{display:flex;gap:8px;margin-top:16px;}
.btn-cancel{flex:1;padding:13px;background:var(--stamp);border:none;border-radius:12px;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit;font-weight:600;}
.btn-ok{flex:2;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-ok:disabled{opacity:0.4;}
.map-hint{padding:7px 14px;background:var(--paper);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
.budget-summary{background:#2d3e5a;border-radius:14px;padding:16px;margin-bottom:16px;color:#fff;}
.budget-summary *{color:#fff !important;}
.budget-prog-bg{background:rgba(255,255,255,0.15);border-radius:4px;height:6px;overflow:hidden;margin-bottom:8px;}
.budget-prog-fill{height:100%;border-radius:4px;transition:width 0.4s;}
.budget-item{background:var(--paper);border:1px solid var(--border);border-radius:11px;padding:12px 13px;margin-bottom:8px;}
.budget-inputs{display:flex;gap:8px;margin-top:8px;}
.budget-inp-wrap{flex:1;}
.budget-inp-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.budget-inp{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;color:var(--ink);outline:none;font-family:inherit;text-align:right;background:#fff;}
.budget-inp:focus{border-color:var(--accent);}
.budget-inp-ghost{width:100%;padding:8px 4px;border:1.5px solid transparent;border-radius:8px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;text-align:right;background:transparent;cursor:pointer;}
.budget-inp-ghost:focus{border-color:var(--accent);background:#fff;padding:8px 10px;cursor:text;}
.budget-inp-ghost.ghost-a{font-weight:800;}
.budget-inp-ghost.ghost-b{color:var(--muted);font-weight:400;font-size:13px;}
.budget-diff.ok{color:var(--green);font-size:11px;font-weight:700;margin-top:4px;text-align:right;}
.budget-diff.over{color:#ef4444;font-size:11px;font-weight:700;margin-top:4px;text-align:right;}
.item-memo{font-size:12px;color:var(--muted);margin-top:3px;padding-left:34px;line-height:1.5;}
.item-memo a{color:var(--accent);text-decoration:none;}
.memo-toggle{background:none;border:none;font-size:11px;color:var(--muted);cursor:pointer;padding:2px 0 0 34px;display:block;font-family:inherit;}
.memo-inp{width:calc(100% - 34px);margin-left:34px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--ink);background:#fff;outline:none;font-family:inherit;margin-top:4px;display:block;}
.weather-section{margin-bottom:16px;}
.weather-city-row{display:flex;gap:8px;margin-bottom:8px;}
.weather-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.weather-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.weather-city-name{font-size:14px;font-weight:700;color:var(--ink);}
.weather-days{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.weather-days::-webkit-scrollbar{display:none;}
.weather-day{flex:0 0 56px;text-align:center;background:var(--stamp);border-radius:8px;padding:6px 4px;}
.weather-day-date{font-size:9px;color:var(--muted);margin-bottom:2px;}
.weather-day-icon{font-size:20px;margin-bottom:2px;}
.weather-day-temp{font-size:10px;font-weight:700;color:var(--ink);}
.weather-day-temp span{color:var(--muted);font-weight:400;}
.weather-loading{font-size:12px;color:var(--muted);padding:8px 0;}
.weather-err{font-size:12px;color:#ef4444;padding:4px 0;}
.attach-list{margin-top:8px;}
.attach-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f4f4f5;border-radius:10px;margin-bottom:8px;}
.attach-item-name{flex:1;font-size:13px;color:#1c1917;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.attach-item-open{background:#2d3e5a;color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;font-family:inherit;}
.attach-item-del{background:none;border:none;color:#aaa;font-size:16px;cursor:pointer;flex-shrink:0;}
.attach-upload{display:flex;align-items:center;gap:8px;margin-top:6px;}
.attach-upload-btn{background:none;border:1.5px dashed var(--border);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;flex:1;}
.attach-progress{font-size:12px;color:#2d3e5a;margin-top:4px;}
.mypage-section{margin-bottom:20px;}
.mypage-section-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.mypage-field{margin-bottom:10px;}
.mypage-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block;}
.mypage-val{font-size:14px;color:var(--ink);padding:10px 13px;background:#f4f4f5;border-radius:10px;border:none;width:100%;font-family:inherit;outline:none;box-sizing:border-box;-webkit-appearance:none;}
.mypage-val:focus{background:#fff;box-shadow:0 0 0 2px #2d3e5a;}
.menu-dropdown{position:fixed;top:64px;right:16px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:200;min-width:160px;overflow:hidden;}
.menu-item{display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:14px;font-weight:600;color:#1c1917;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.menu-item:not(:last-child){border-bottom:1px solid var(--border);}
.menu-item:active{background:#f4f4f5;}
.menu-overlay{position:fixed;inset:0;z-index:199;}
.guide-modal{background:var(--paper);border-radius:22px 22px 0 0;padding:22px 18px 44px;width:100%;max-width:480px;margin:0 auto;max-height:85vh;overflow-y:auto;animation:up 0.22s ease;}
.guide-step{display:flex;gap:14px;align-items:flex-start;margin-bottom:24px;}
.guide-step-num{width:32px;height:32px;border-radius:50%;background:#1c1917;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.guide-step-title{font-size:15px;font-weight:700;color:#1c1917;margin-bottom:4px;}
.guide-step-desc{font-size:13px;color:var(--muted);line-height:1.7;}
.guide-tab-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.guide-tab-item{background:var(--stamp);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--ink);font-weight:600;}
.hero{background:var(--paper);padding:10px 18px;border-bottom:1px solid var(--border);}
.guest-banner{background:#f4f4f5;border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);}
.guest-banner-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.guest-try-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:16px;padding:8px 0;text-decoration:underline;}
@media(min-width:768px){.trip-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;}}
.trip-card-cover-wrap{position:relative;width:100%;height:110px;border-radius:16px 16px 0 0;overflow:hidden;cursor:default;}
.trip-card-cover-img{width:100%;height:110px;object-fit:cover;display:block;}
.trip-card-cover-btn{position:absolute;bottom:7px;right:8px;background:rgba(0,0,0,0.45);border:none;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;backdrop-filter:blur(2px);z-index:2;}
.hero-cover-wrap{position:relative;width:100%;height:140px;overflow:hidden;}
.hero-cover-img{width:100%;height:140px;object-fit:cover;display:block;}
.hero-cover-placeholder{width:100%;height:140px;}
.hero-cover-btn{position:absolute;bottom:8px;right:12px;background:rgba(0,0,0,0.45);border:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;backdrop-filter:blur(2px);}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.hero-meta span{font-size:12px;color:var(--muted);}
.hero-meta .pill{color:#fff !important;}
</style>

<body>

var rateCache={rate:null,base:null,ts:0};
async function getRate(code){
  if(code==="JPY")return{rate:1,symbol:"¥"};
  var now=Date.now();
  if(rateCache.base===code&&rateCache.rate&&(now-rateCache.ts)<3600000)return{rate:rateCache.rate,symbol:(CURRENCIES.find(function(c){return c.code===code;})||{symbol:code}).symbol};
  var sym=(CURRENCIES.find(function(c){return c.code===code;})||{symbol:code}).symbol;
  var apis=["https://open.er-api.com/v6/latest/JPY","https://api.exchangerate-api.com/v4/latest/JPY"];
  for(var i=0;i<apis.length;i++){try{var r=await fetch(apis[i]);var d=await r.json();var rates=d.rates||d.conversion_rates;if(rates&&rates[code]){var rate=1/rates[code];rateCache={rate:rate,base:code,ts:now};return{rate:rate,symbol:sym};}}catch(e){}}
  return{rate:null,symbol:sym};
}

var rate2Cache={};
async function getRate2(from,to){
  if(from===to)return 1;
  var key=from+"_"+to;var now=Date.now();
  if(rate2Cache[key]&&(now-rate2Cache[key].ts)<3600000)return rate2Cache[key].rate;
  var rF=await getRate(from);var rT=await getRate(to);
  if(rF&&rF.rate&&rT&&rT.rate){var r=rF.rate/rT.rate;rate2Cache[key]={rate:r,ts:now};return r;}
  return null;
}

  var curs=sel.currencies||{A:"JPY",B:"USD"};
  var isA=field.endsWith("_A");
  var mirror=field.replace(isA?"_A":"_B",isA?"_B":"_A");
  var from=isA?curs.A:curs.B;var to=isA?curs.B:curs.A;

function resizeCoverImage(file){
  return new Promise(function(resolve){
    if(file.size>5*1024*1024){toast("写真は5MB以内にしてください");resolve(null);return;}
    var img=new Image();var url=URL.createObjectURL(file);
    img.onload=function(){
      var MW=1200,MH=630,w=img.width,h=img.height;
      if(w>MW){h=Math.round(h*MW/w);w=MW;}
      if(h>MH){w=Math.round(w*MH/h);h=MH;}
      var canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      canvas.toBlob(function(blob){resolve(blob);},"image/jpeg",0.8);
    };
    img.onerror=function(){URL.revokeObjectURL(url);resolve(null);};
    img.src=url;
  });
}

async function addBudgetEntry(itemIdx,entry){
  var sel=getSel();if(!sel)return;
  var b=JSON.parse(JSON.stringify(sel.budget||[]));if(!b[itemIdx])return;
  if(!b[itemIdx].entries)b[itemIdx].entries=[];
  b[itemIdx].entries.push(entry);
  // actual_A/B を明細合計で再計算
  b[itemIdx].actual_A=b[itemIdx].entries.reduce(function(s,e){return s+(parseFloat(e.amtA)||0);},0);
  b[itemIdx].actual_B=b[itemIdx].entries.reduce(function(s,e){return s+(parseFloat(e.amtB)||0);},0);
  await upd({budget:b});
}
async function delBudgetEntry(itemIdx,entryIdx){
  var sel=getSel();if(!sel)return;
  var b=JSON.parse(JSON.stringify(sel.budget||[]));if(!b[itemIdx])return;
  if(!b[itemIdx].entries)b[itemIdx].entries=[];
  b[itemIdx].entries.splice(entryIdx,1);
  b[itemIdx].actual_A=b[itemIdx].entries.reduce(function(s,e){return s+(parseFloat(e.amtA)||0);},0);
  b[itemIdx].actual_B=b[itemIdx].entries.reduce(function(s,e){return s+(parseFloat(e.amtB)||0);},0);
  await upd({budget:b});
  if(budgetExpandedEntry&&budgetExpandedEntry.iIdx===itemIdx&&budgetExpandedEntry.eIdx===entryIdx)budgetExpandedEntry=null;
}
async function editBudgetEntry(itemIdx,entryIdx,patch){

  Object.assign(b[itemIdx].entries[entryIdx],patch);
  b[itemIdx].actual_A=b[itemIdx].entries.reduce(function(s,e){return s+(parseFloat(e.amtA)||0);},0);
  b[itemIdx].actual_B=b[itemIdx].entries.reduce(function(s,e){return s+(parseFloat(e.amtB)||0);},0);
  await upd({budget:b});
  budgetExpandedEntry=null;
}

    var labIn=ce("input","mypage-val",{placeholder:"項目名",value:rec.label||"",style:{flex:"1",minWidth:"0"}});labIn.onblur=function(e){profile.records[idx].label=e.target.value;saveProfile();};
    ap(head,labIn);if(idx>=5)ap(head,delBtn(function(){delRecordRow(idx);}));ap(box,head);
    var list=ce("div","attach-list");
    (rec.attachments||[]).forEach(function(att,aidx){
      var r=ce("div","attach-item");ap(r,ap(ce("span",""),tx(att.type&&att.type.includes("pdf")?"📄":"🖼")),ap(ce("div","attach-item-name"),tx(att.name)));
      ap(r,ap(ce("button","attach-item-open",{onclick:function(){window.open(att.url,"_blank");}}),tx("開く")),ap(ce("button","attach-item-del",{onclick:function(){if(confirm("削除しますか？"))delRecordFile(idx,aidx);}}),tx("✕")));ap(list,r);
    });
    var fileInput=ce("input","",{type:"file",accept:"image/*,application/pdf,.pdf,.jpg,.jpeg,.png,.heic",style:{display:"none"}});var prog=ce("div","attach-progress");
    var upRow=ce("div","attach-upload");
    if((rec.attachments||[]).length<3)ap(upRow,ap(ce("button","attach-upload-btn",{onclick:function(){fileInput.click();}}),tx("＋ ファイルを追加（3MB以内）")));
    fileInput.onchange=function(e){var f=e.target.files[0];if(f)addRecordFile(idx,f,prog);};
    ap(box,list,fileInput,upRow,prog);ap(recSec,box);
  });
  if(profile.records.length<10)ap(recSec,ap(ce("button","attach-upload-btn",{style:{marginTop:"2px"},onclick:function(){profile.records.push({id:mkId(),label:"",attachments:[]});saveProfile();render();}}),tx("＋ 記録を追加")));
  ap(m.modal,recSec);
  ap(m.modal,ap(ce("div","modal-acts"),ap(ce("button","btn-ok",{style:{flex:"1",border:"none"},onclick:function(){showMyPage=false;render();}}),tx("閉じる"))));
  return m.ov;
}

// ── Init ──
firebase.initializeApp(FB_CONFIG);
auth=firebase.auth();db=firebase.firestore();
try{if(firebase.storage)storage=firebase.storage();}catch(e){console.warn("storage init:",e);}
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(e){console.warn("persistence:",e);});
auth.onAuthStateChanged(function(u){
  user=u;
  if(u&&isGuest){isGuest=false;trips=[];selId=null;view="list";}
  var sharedId=getSharedId();
  if(sharedId&&!isViewOnly){loadSharedTrip(sharedId);return;}
  if(u){subscribeTrips();subscribeTemplates();loadProfile();}
  else{if(tripsUnsub){tripsUnsub();tripsUnsub=null;}if(tplUnsub){tplUnsub();tplUnsub=null;}trips=[];}
  render();
});
var resizeTm=null;window.addEventListener("resize",function(){clearTimeout(resizeTm);resizeTm=setTimeout(render,150);});
</script>
