<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>たびノート</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f2ed;--paper:#faf9f6;--ink:#1c1917;--muted:#78716c;
  --border:#e2ddd6;--accent:#c2541a;--green:#4a7c59;--stamp:#ede9e3;
}
body{font-family:'Hiragino Kaku Gothic Pro','Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);}

/* Loading / Login */
.center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center;}
.login-bg{background:#1c1917 !important;}
.login-icon{font-size:72px;margin-bottom:20px;}
.login-label{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.35);margin-bottom:8px;text-transform:uppercase;}
.login-title{font-size:34px;font-weight:800;color:#fff;margin-bottom:10px;}
.login-sub{font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:52px;line-height:1.8;white-space:pre-line;}
.google-btn{display:flex;align-items:center;gap:12px;background:#fff;border:none;border-radius:16px;padding:16px 32px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 8px 32px rgba(0,0,0,0.4);width:100%;max-width:320px;justify-content:center;}

/* Header */
.app-header{background:var(–ink);color:#fff;padding:16px 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.back-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.header-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-sub{font-size:10px;color:rgba(255,255,255,0.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.header-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.ghost-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ghost-btn.active{background:var(–accent);}
.add-trip-btn{background:var(–accent);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}

/* Toast */
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(–ink);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.3);animation:fadeIn 0.2s ease;pointer-events:none;}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-6px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* Trip list */
.trip-cards{padding:16px;display:flex;flex-direction:column;gap:12px;}
.trip-card{background:var(–paper);border-radius:16px;padding:18px 18px 14px;border:1px solid var(–border);cursor:pointer;position:relative;overflow:hidden;}
.trip-card::before{content:’’;position:absolute;left:0;top:0;bottom:0;width:4px;background:var(–accent);border-radius:4px 0 0 4px;}
.trip-card-del{position:absolute;top:14px;right:14px;background:none;border:none;color:var(–border);font-size:16px;cursor:pointer;padding:4px;line-height:1;}
.trip-name{font-size:18px;font-weight:800;color:var(–ink);}
.trip-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;}
.trip-meta span{font-size:12px;color:var(–muted);}
.days-pill{background:var(–accent)!important;color:#fff!important;font-weight:700!important;padding:2px 9px;border-radius:20px;}
.count-chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.count-chip{background:var(–stamp);border-radius:8px;padding:4px 9px;font-size:11px;color:var(–muted);font-weight:600;}
.type-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.type-badge.overseas{background:#dbeafe;color:#1d4ed8;}
.type-badge.domestic{background:#dcfce7;color:#166534;}
.shared-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:#fef3c7;color:#92400e;}

/* Tabs */
.tabs{display:flex;background:var(–paper);border-bottom:1px solid var(–border);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;cursor:pointer;border-bottom:2.5px solid transparent;font-size:10px;font-weight:600;color:var(–muted);transition:all 0.15s;}
.tab.active{color:var(–ink);border-bottom-color:var(–accent);}
.tab-icon{font-size:18px;}
.tab-badge{background:var(–stamp);color:var(–muted);font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center;}
.tab.active .tab-badge{background:var(–accent);color:#fff;}

/* Content */
.content{padding:16px;}
.section-box{background:var(–paper);border:1px solid var(–border);border-radius:14px;padding:14px;margin-bottom:16px;}
.input-row{display:flex;gap:8px;margin-bottom:8px;}
.main-input{flex:1;padding:12px 14px;background:var(–paper);border:1.5px solid var(–border);border-radius:12px;font-size:15px;color:var(–ink);outline:none;font-family:inherit;-webkit-appearance:none;width:100%;}
.main-input:focus{border-color:var(–accent);}
.add-btn{padding:12px 16px;background:var(–accent);color:#fff;border:none;border-radius:12px;font-size:20px;cursor:pointer;font-family:inherit;line-height:1;flex-shrink:0;}
.add-btn:disabled{opacity:0.5;}

/* Progress */
.progress-row{display:flex;justify-content:space-between;font-size:11px;color:var(–muted);margin-bottom:5px;}
.prog-bg{background:var(–border);border-radius:4px;height:4px;margin-bottom:16px;overflow:hidden;}
.prog-bar{height:100%;background:var(–green);border-radius:4px;transition:width 0.4s;}

/* Items */
.item-card{background:var(–paper);border:1px solid var(–border);border-radius:12px;padding:13px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.item-card.done{opacity:0.48;}
.check-btn{width:26px;height:26px;border-radius:8px;border:2px solid var(–border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#fff;transition:all 0.15s;}
.check-btn.on{background:var(–green);border-color:var(–green);}
.item-text{flex:1;font-size:15px;color:var(–ink);line-height:1.4;}
.item-text.done{text-decoration:line-through;color:var(–muted);}
.icon-btn{background:var(–stamp);border:none;cursor:pointer;font-size:14px;padding:5px 8px;border-radius:7px;color:var(–muted);flex-shrink:0;}
.tpl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(–accent);opacity:0.5;margin-right:6px;vertical-align:middle;}

/* Itinerary */
.date-header{font-size:13px;font-weight:800;color:var(–ink);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.date-header::before{content:’’;display:inline-block;width:4px;height:16px;background:var(–accent);border-radius:2px;}
.itin-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;padding:0 4px;}
.itin-time{font-size:13px;font-weight:700;color:var(–accent);width:44px;flex-shrink:0;padding-top:2px;}
.itin-timeline{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:16px;padding-top:4px;}
.itin-dot{width:10px;height:10px;border-radius:50%;background:var(–accent);border:2px solid var(–bg);box-shadow:0 0 0 2px var(–accent);}
.itin-line{width:2px;flex:1;min-height:16px;background:var(–border);}
.itin-text-wrap{flex:1;font-size:14px;color:var(–ink);line-height:1.5;padding-top:1px;}
.place-num{width:26px;height:26px;border-radius:50%;background:var(–accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Empty */
.empty{text-align:center;padding:48px 16px;color:var(–muted);}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:0.5;}
.empty-text{font-size:13px;line-height:1.7;}

/* Tab type buttons */
.type-btn-row{display:flex;gap:8px;margin-bottom:16px;}
.type-btn{padding:9px 16px;border:1.5px solid var(–border);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:var(–paper);color:var(–muted);font-family:inherit;flex:1;}
.type-btn.active{background:var(–accent);color:#fff;border-color:var(–accent);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;z-index:100;backdrop-filter:blur(3px);}
.modal{background:var(–paper);border-radius:24px 24px 0 0;padding:24px 20px 44px;width:100%;max-width:480px;margin:0 auto;box-shadow:0 -8px 40px rgba(0,0,0,0.2);animation:slideUp 0.25s ease;max-height:92vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(60px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(–border);border-radius:4px;margin:0 auto 20px;}
.modal-title{font-size:18px;font-weight:800;color:var(–ink);margin-bottom:18px;}
.form-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(–muted);margin-bottom:5px;display:block;}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(–border);border-radius:10px;font-size:15px;color:var(–ink);background:#fff;outline:none;font-family:inherit;-webkit-appearance:none;margin-bottom:0;}
.form-input:focus{border-color:var(–accent);}
.form-group{margin-bottom:12px;}
.form-row{display:flex;gap:10px;}
.modal-actions{display:flex;gap:8px;margin-top:18px;}
.btn-cancel{flex:1;padding:13px;background:var(–stamp);border:none;border-radius:12px;font-size:14px;cursor:pointer;color:var(–muted);font-family:inherit;font-weight:600;}
.btn-primary{flex:2;padding:13px;background:var(–accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}

/* Map hint */
.map-hint{padding:8px 16px;background:var(–paper);border-bottom:1px solid var(–border);font-size:12px;color:var(–muted);}
</style>

</head>
<body>
<div id="app"></div>

<script>
// ── Firebase config ──
const FB_CONFIG = {
  apiKey: "AIzaSyAc4RN6JR3DZd0d3EabrjgqT8t6ZOZQtMI",
  authDomain: "tabinote-40a95.firebaseapp.com",
  projectId: "tabinote-40a95",
  storageBucket: "tabinote-40a95.firebasestorage.app",
  messagingSenderId: "333188151359",
  appId: "1:333188151359:web:a811a166f1fb096a20e08a"
};

firebase.initializeApp(FB_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

// ── State ──
let user = null;
let trips = [];
let templates = {
  domestic: {
    packing: ["財布・現金","スマートフォン","充電器","常備薬","着替え","タオル"],
    todo:    ["宿泊先の予約確認","交通手段の確認","天気予報チェック"]
  },
  overseas: {
    packing: ["パスポート","航空券(eチケット)","海外保険証","外貨・クレジットカード","充電器(変換プラグ)","常備薬","着替え"],
    todo:    ["パスポート有効期限確認","ビザ取得確認","航空券の予約確認","ホテルの予約確認","海外保険加入","外貨両替"]
  }
};

let view = "list";       // list | detail | templates
let selId = null;
let activeTab = "itinerary";

// form state
let tripForm = { name:"", destination:"", startDate:"", endDate:"", type:"overseas" };
let itinForm = { date:"", time:"", text:"" };
let checkInput = "";
let placeInput = "";
let placeMemo  = "";
let shareEmail = "";
let pinName = "";
let tplTab = "domestic";
let tplInput = { packing:"", todo:"" };

let showNewTrip  = false;
let showShare    = false;
let showPinModal = false;
let showMap      = false;
let geocoding    = false;
let pendingPin   = null;
let saving       = false;

let tripsUnsub = null;
let tplUnsub   = null;
let mapInstance = null;
let mapMarkers  = [];

// ── Helpers ──
function mkId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function getDaysLeft(startDate) {
  if (!startDate) return null;
  const diff = Math.ceil((new Date(startDate) - new Date()) / 86400000);
  if (diff > 0) return `あと${diff}日`;
  if (diff === 0) return "今日出発！";
  return `${Math.abs(diff)}日前`;
}

function fmtDate(d) {
  if (!d) return "日付未設定";
  const dt = new Date(d + "T00:00:00");
  return `${dt.getMonth()+1}月${dt.getDate()}日（${"日月火水木金土"[dt.getDay()]}）`;
}

function getSel() { return trips.find(t => t.id === selId); }

let toastTimer = null;
function showToast(msg) {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2500);
}

// ── Geocode ──
async function geocode(q) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`, { headers:{"Accept-Language":"ja"} });
    const d = await r.json();
    if (d[0]) return { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
  } catch(e) {}
  return null;
}

// ── Map ──
function initMap() {
  const el = document.getElementById("leaflet-map");
  if (!el || mapInstance) return;
  mapInstance = L.map(el).setView([35.6762, 139.6503], 5);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution:"© OpenStreetMap contributors"
  }).addTo(mapInstance);
  mapInstance.on("click", e => {
    pendingPin = e.latlng;
    pinName = "";
    showPinModal = true;
    render();
  });
  syncMarkers();
}

function destroyMap() {
  if (mapInstance) { mapInstance.remove(); mapInstance = null; mapMarkers = []; }
}

function syncMarkers() {
  if (!mapInstance) return;
  const sel = getSel();
  const spots = sel?.places ?? [];
  mapMarkers.forEach(m => m.remove());
  mapMarkers = [];
  spots.forEach((s, i) => {
    if (!s.lat || !s.lng) return;
    const icon = L.divIcon({
      className: "",
      html: `<div style="background:#c2541a;color:#fff;border-radius:50% 50% 50% 0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);transform:rotate(-45deg)"><span style="transform:rotate(45deg)">${i+1}</span></div>`,
      iconSize:[28,28], iconAnchor:[14,28], popupAnchor:[0,-30]
    });
    const m = L.marker([s.lat, s.lng], { icon }).addTo(mapInstance);
    m.bindPopup(`<b>${i+1}. ${s.name}</b>${s.memo?`<br><small>${s.memo}</small>`:""}`);
    mapMarkers.push(m);
  });
  if (spots.some(s=>s.lat)) {
    const valid = spots.filter(s=>s.lat);
    mapInstance.fitBounds(L.latLngBounds(valid.map(s=>[s.lat,s.lng])), { padding:[40,40], maxZoom:14 });
  }
}

// ── Firebase ──
async function loginGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try { await auth.signInWithPopup(provider); }
  catch(e) { showToast("ログインに失敗: " + e.message); }
}

async function logout() {
  if (tripsUnsub) { tripsUnsub(); tripsUnsub = null; }
  if (tplUnsub)   { tplUnsub();   tplUnsub   = null; }
  await auth.signOut();
  trips = []; view = "list"; selId = null;
  render();
}

async function upd(patch) {
  const sel = getSel(); if (!sel) return;
  await db.collection("trips").doc(sel.id).update(patch);
}

async function createTrip() {
  if (!tripForm.name.trim() || saving || !user) return;
  saving = true; render();
  try {
    const tpl = templates[tripForm.type] ?? { packing:[], todo:[] };
    const ref = await db.collection("trips").add({
      name: tripForm.name.trim(),
      destination: tripForm.destination.trim(),
      startDate: tripForm.startDate,
      endDate: tripForm.endDate,
      type: tripForm.type,
      ownerId: user.uid,
      ownerName: user.displayName || user.email,
      memberIds: [user.uid],
      members: [{ uid:user.uid, name:user.displayName||user.email, email:user.email }],
      itinerary: [],
      packing: tpl.packing.map(t => ({ id:mkId(), text:t, checked:false, template:true })),
      todo:    tpl.todo.map(t => ({ id:mkId(), text:t, checked:false, template:true })),
      places: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    selId = ref.id;
    tripForm = { name:"", destination:"", startDate:"", endDate:"", type:"overseas" };
    showNewTrip = false;
    view = "detail";
    activeTab = "itinerary";
    showToast("旅行を作成しました！");
  } catch(e) {
    console.error("createTrip error:", e);
    showToast("作成に失敗: " + e.message);
  } finally {
    saving = false;
    render();
  }
}

async function deleteTrip(id) {
  if (!confirm("この旅行を削除しますか？")) return;
  await db.collection("trips").doc(id).delete();
  if (selId === id) { selId = null; view = "list"; }
  showToast("削除しました");
  render();
}

async function shareTrip() {
  if (!shareEmail.trim()) return;
  const sel = getSel(); if (!sel) return;
  try {
    await db.collection("trips").doc(sel.id).update({
      memberIds: firebase.firestore.FieldValue.arrayUnion(shareEmail.trim()),
      members:   firebase.firestore.FieldValue.arrayUnion({ uid:shareEmail.trim(), name:shareEmail.trim(), email:shareEmail.trim() }),
    });
    shareEmail = "";
    showToast("招待しました！");
    render();
  } catch(e) { showToast("共有に失敗: " + e.message); }
}

async function addItin() {
  if (!itinForm.text.trim()) return;
  const sel = getSel(); if (!sel) return;
  const item = { id:mkId(), date:itinForm.date, time:itinForm.time, text:itinForm.text.trim() };
  const sorted = [...(sel.itinerary||[]), item].sort((a,b) => {
    const da=(a.date+a.time)||"", db2=(b.date+b.time)||"";
    return da < db2 ? -1 : da > db2 ? 1 : 0;
  });
  await upd({ itinerary: sorted });
  itinForm = { date:itinForm.date, time:"", text:"" };
  render();
}

async function delItin(id) {
  const sel = getSel(); if (!sel) return;
  await upd({ itinerary: (sel.itinerary||[]).filter(i=>i.id!==id) });
}

async function addCheck(tab) {
  if (!checkInput.trim()) return;
  const sel = getSel(); if (!sel) return;
  await upd({ [tab]: [...(sel[tab]||[]), { id:mkId(), text:checkInput.trim(), checked:false }] });
  checkInput = ""; render();
}

async function toggleCheck(tab, id) {
  const sel = getSel(); if (!sel) return;
  await upd({ [tab]: (sel[tab]||[]).map(i => i.id===id ? { ...i, checked:!i.checked } : i) });
}

async function delCheck(tab, id) {
  const sel = getSel(); if (!sel) return;
  await upd({ [tab]: (sel[tab]||[]).filter(i=>i.id!==id) });
}

async function addPlace() {
  const name = placeInput.trim(); if (!name) return;
  geocoding = true; render();
  try {
    const geo = await geocode(name);
    const sel = getSel(); if (!sel) return;
    await upd({ places: [...(sel.places||[]), { id:mkId(), name, memo:placeMemo.trim(), lat:geo?.lat, lng:geo?.lng }] });
    placeInput = ""; placeMemo = "";
  } finally { geocoding = false; render(); }
}

async function delPlace(id) {
  const sel = getSel(); if (!sel) return;
  await upd({ places: (sel.places||[]).filter(p=>p.id!==id) });
}

async function confirmPin() {
  if (!pinName.trim() || !pendingPin) return;
  const sel = getSel(); if (!sel) return;
  await upd({ places: [...(sel.places||[]), { id:mkId(), name:pinName.trim(), memo:"", lat:pendingPin.lat, lng:pendingPin.lng }] });
  showPinModal = false; pendingPin = null; pinName = ""; render();
}

async function saveTpl(next) {
  templates = next;
  try { await db.collection("users").doc(user.uid).collection("settings").doc("templates").set(next); } catch {}
}

async function addTplItem(tab) {
  if (!tplInput[tab].trim()) return;
  const next = { ...templates, [tplTab]: { ...templates[tplTab], [tab]: [...(templates[tplTab]?.[tab]??[]), tplInput[tab].trim()] } };
  await saveTpl(next);
  tplInput = { ...tplInput, [tab]:"" }; render();
}

async function delTplItem(tab, idx) {
  const next = { ...templates, [tplTab]: { ...templates[tplTab], [tab]: templates[tplTab][tab].filter((_,i)=>i!==idx) } };
  await saveTpl(next);
}

// ── Subscribe on login ──
function subscribeTrips() {
  if (tripsUnsub) tripsUnsub();
  tripsUnsub = db.collection("trips")
    .where("memberIds","array-contains", user.uid)
    .onSnapshot(snap => {
      trips = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      trips.sort((a,b) => (a.createdAt?.seconds??0) - (b.createdAt?.seconds??0));
      syncMarkers();
      render();
    }, err => {
      console.warn("Firestore snapshot error:", err);
      render();
    });
}

function subscribeTemplates() {
  if (tplUnsub) tplUnsub();
  tplUnsub = db.collection("users").doc(user.uid)
    .collection("settings").doc("templates")
    .onSnapshot(snap => {
      if (snap.exists) { templates = snap.data(); render(); }
    });
}

auth.onAuthStateChanged(u => {
  user = u;
  if (u) { subscribeTrips(); subscribeTemplates(); }
  else   { trips = []; }
  render();
});

// ── RENDER ──
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === "className") el.className = v;
    else if (k.startsWith("on")) el[k.toLowerCase()] = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return el;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (!user) {
    // reset modal states when not logged in
    showNewTrip = false; showShare = false; showPinModal = false;
    app.appendChild(renderLogin());
    return;
  }

  app.appendChild(renderHeader());
  if (view === "list")      app.appendChild(renderList());
  if (view === "templates") app.appendChild(renderTemplates());
  if (view === "detail")    app.appendChild(renderDetail());
  if (showNewTrip)  app.appendChild(renderNewTripModal());
  if (showShare)    app.appendChild(renderShareModal());
  if (showPinModal) app.appendChild(renderPinModal());

  // init map after DOM
  if (view === "detail" && activeTab === "places" && showMap) {
    requestAnimationFrame(() => { if (!mapInstance) initMap(); else syncMarkers(); });
  }
}

    h("div", { style:{ fontSize:"11px", color:"var(--muted)", marginBottom:"16px" } }, "※ 同じメールアドレスでGoogleログインすると旅行が表示されます"),
    h("div", { className:"modal-actions" },
      h("button", { className:"btn-cancel", style:{ flex:"1" }, onclick:()=>{ showShare=false; render(); } }, "閉じる")
    )
  ]);
}

function renderPinModal() {
  return renderModal([
    h("div", { className:"modal-handle" }),
    h("div", { className:"modal-title" }, "📍 ピンを立てる"),
    h("div", { className:"form-group" },
      h("label", { className:"form-label" }, "場所の名前"),
      h("input", { className:"form-input", placeholder:"例：景福宮", value: pinName, autofocus:"true",
        oninput: e => { pinName = e.target.value; },
        onkeydown: e => { if(e.key==="Enter") confirmPin(); }
      })
    ),
    h("div", { className:"modal-actions" },
      h("button", { className:"btn-cancel", onclick:()=>{ showPinModal=false; render(); } }, "キャンセル"),
      h("button", { className:"btn-primary", onclick: confirmPin }, "追加")
    )
  ]);
}

// Initial render (loading state)
render();
</script>

</body>
</html>
