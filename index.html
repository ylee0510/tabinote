<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>たびノート</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="たびノート"/>
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f5f2ed;--paper:#faf9f6;--ink:#1c1917;--muted:#78716c;--border:#e2ddd6;--accent:#c2541a;--green:#4a7c59;--stamp:#ede9e3;}
body{font-family:'Hiragino Kaku Gothic Pro','Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;}
#app{max-width:480px;margin:0 auto;min-height:100vh;}
.page-login{background:#1c1917;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;}
.page-loading{background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.login-icon{font-size:64px;margin-bottom:16px;}
.login-badge{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.4);margin-bottom:8px;text-transform:uppercase;}
.login-title{font-size:32px;font-weight:800;color:#fff;margin-bottom:10px;}
.login-desc{font-size:14px;color:rgba(255,255,255,0.55);margin-bottom:48px;line-height:1.8;white-space:pre-line;}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border:none;border-radius:14px;padding:15px 28px;font-size:15px;font-weight:700;cursor:pointer;width:100%;max-width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.hdr{background:#1c1917;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.hdr-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.hdr-r{display:flex;gap:8px;flex-shrink:0;}
.back-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;}
.hdr-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:rgba(255,255,255,0.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.icon-btn2{background:rgba(255,255,255,0.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;}
.icon-btn2.on{background:var(--accent);}
.add-btn2{background:var(--accent);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.trip-list{padding:16px;display:flex;flex-direction:column;gap:12px;}
.trip-card{background:var(--paper);border-radius:16px;padding:16px 16px 12px;border:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;}
.trip-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);border-radius:4px 0 0 4px;}
.trip-del{position:absolute;top:12px;right:12px;background:none;border:none;color:#ccc;font-size:15px;cursor:pointer;}
.trip-nm{font-size:18px;font-weight:800;color:#1c1917;padding-right:28px;}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.badge-os{background:#dbeafe;color:#1d4ed8;}
.badge-dm{background:#dcfce7;color:#166534;}
.badge-sh{background:#fef3c7;color:#92400e;}
.pill{background:var(--accent);color:#fff !important;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
.chip{background:var(--stamp);border-radius:8px;padding:3px 9px;font-size:11px;color:var(--muted);font-weight:600;}
.tabs{display:flex;background:var(--paper);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 7px;cursor:pointer;border-bottom:2.5px solid transparent;font-size:10px;font-weight:600;color:var(--muted);}
.tab.on{color:#1c1917;border-bottom-color:var(--accent);}
.tab-ic{font-size:17px;}
.tab-n{background:var(--stamp);color:var(--muted);font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;}
.tab.on .tab-n{background:var(--accent);color:#fff;}
.content{padding:16px;}
.form-box{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px;}
.row{display:flex;gap:8px;margin-bottom:8px;}
.inp{flex:1;padding:11px 13px;background:var(--paper);border:1.5px solid var(--border);border-radius:11px;font-size:15px;color:#1c1917;outline:none;font-family:inherit;-webkit-appearance:none;width:100%;}
.inp:focus{border-color:var(--accent);}
.plus-btn{padding:11px 15px;background:var(--accent);color:#fff;border:none;border-radius:11px;font-size:19px;cursor:pointer;flex-shrink:0;}
.plus-btn:disabled{opacity:0.5;}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;}
.prog-bg{background:var(--border);border-radius:4px;height:4px;margin-bottom:14px;overflow:hidden;}
.prog-fill{height:100%;background:var(--green);border-radius:4px;transition:width 0.4s;}
.item{background:var(--paper);border:1px solid var(--border);border-radius:11px;padding:12px 11px;margin-bottom:8px;display:flex;align-items:center;gap:9px;}
.item.done{opacity:0.45;}
.chk{width:25px;height:25px;border-radius:7px;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;transition:all 0.15s;}
.chk.on{background:var(--green);border-color:var(--green);}
.item-txt{flex:1;font-size:15px;color:#1c1917;line-height:1.4;}
.item-txt.done{text-decoration:line-through;color:var(--muted);}
.del-btn{background:var(--stamp);border:none;cursor:pointer;font-size:13px;padding:5px 7px;border-radius:7px;flex-shrink:0;}
.tpl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0.5;margin-right:5px;vertical-align:middle;}
.empty{text-align:center;padding:44px 16px;color:var(--muted);}
.empty-ic{font-size:34px;margin-bottom:10px;opacity:0.5;}
.empty-tx{font-size:13px;line-height:1.7;}
.date-hdr{font-size:13px;font-weight:800;color:#1c1917;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.date-hdr::before{content:'';display:inline-block;width:4px;height:15px;background:var(--accent);border-radius:2px;}
.itin-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.itin-time{font-size:13px;font-weight:700;color:var(--accent);width:44px;flex-shrink:0;padding-top:1px;}
.itin-tl{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0;padding-top:3px;}
.itin-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.itin-line{width:2px;flex:1;min-height:14px;background:var(--border);}
.itin-tx{flex:1;font-size:14px;color:#1c1917;line-height:1.5;}
.place-num{width:25px;height:25px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.type-row{display:flex;gap:8px;margin-bottom:12px;}
.type-btn{flex:1;padding:9px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:var(--paper);color:var(--muted);font-family:inherit;}
.type-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;z-index:100;backdrop-filter:blur(2px);}
.modal{background:var(--paper);border-radius:22px 22px 0 0;padding:22px 18px 44px;width:100%;max-width:480px;margin:0 auto;max-height:92vh;overflow-y:auto;animation:up 0.22s ease;}
@keyframes up{from{transform:translateY(50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-bar{width:34px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 18px;}
.modal-title{font-size:17px;font-weight:800;color:#1c1917;margin-bottom:16px;}
.lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block;}
.fg{margin-bottom:11px;}
.finp{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;color:#1c1917;background:#fff;outline:none;font-family:inherit;-webkit-appearance:none;}
.finp:focus{border-color:var(--accent);}
.modal-acts{display:flex;gap:8px;margin-top:16px;}
.btn-cancel{flex:1;padding:13px;background:var(--stamp);border:none;border-radius:12px;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit;font-weight:600;}
.btn-ok{flex:2;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-ok:disabled{opacity:0.4;}
.map-hint{padding:7px 14px;background:var(--paper);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
.budget-summary{background:var(--ink);border-radius:14px;padding:16px;margin-bottom:16px;color:#fff;}
.budget-prog-bg{background:rgba(255,255,255,0.15);border-radius:4px;height:6px;overflow:hidden;margin-bottom:8px;}
.budget-prog-fill{height:100%;border-radius:4px;transition:width 0.4s;}
.budget-item{background:var(--paper);border:1px solid var(--border);border-radius:11px;padding:12px 13px;margin-bottom:8px;}
.budget-inputs{display:flex;gap:8px;margin-top:8px;}
.budget-inp-wrap{flex:1;}
.budget-inp-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.budget-inp{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;color:var(--ink);outline:none;font-family:inherit;text-align:right;background:#fff;}
.budget-inp:focus{border-color:var(--accent);}
.currency-selector{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.currency-btn{padding:6px 10px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--paper);color:var(--muted);font-family:inherit;white-space:nowrap;}
.currency-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.item-memo{font-size:12px;color:var(--muted);margin-top:3px;padding-left:34px;line-height:1.5;}
.item-memo a{color:var(--accent);text-decoration:none;}
.memo-toggle{background:none;border:none;font-size:11px;color:var(--muted);cursor:pointer;padding:2px 0 0 34px;display:block;font-family:inherit;}
.memo-toggle:hover{color:var(--accent);}
.memo-inp{width:calc(100% - 34px);margin-left:34px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--ink);background:#fff;outline:none;font-family:inherit;margin-top:4px;display:block;}
.memo-inp:focus{border-color:var(--accent);}
.weather-section{margin-bottom:16px;}
.weather-city-row{display:flex;gap:8px;margin-bottom:8px;}
.weather-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.weather-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.weather-city-name{font-size:14px;font-weight:700;color:var(--ink);}
.weather-days{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.weather-days::-webkit-scrollbar{display:none;}
.weather-day{flex:0 0 56px;text-align:center;background:var(--stamp);border-radius:8px;padding:6px 4px;}
.weather-day-date{font-size:9px;color:var(--muted);margin-bottom:2px;}
.weather-day-icon{font-size:20px;margin-bottom:2px;}
.weather-day-temp{font-size:10px;font-weight:700;color:var(--ink);}
.weather-day-temp span{color:var(--muted);font-weight:400;}
.weather-loading{font-size:12px;color:var(--muted);padding:8px 0;}
.weather-err{font-size:12px;color:#ef4444;padding:4px 0;}
.guide-modal{background:var(--paper);border-radius:22px 22px 0 0;padding:22px 18px 44px;width:100%;max-width:480px;margin:0 auto;max-height:85vh;overflow-y:auto;animation:up 0.22s ease;}
.guide-step{display:flex;gap:14px;align-items:flex-start;margin-bottom:24px;}
.guide-step-num{width:32px;height:32px;border-radius:50%;background:#1c1917;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.guide-step-body{}
.guide-step-title{font-size:15px;font-weight:700;color:#1c1917;margin-bottom:4px;}
.guide-step-desc{font-size:13px;color:var(--muted);line-height:1.7;}
.guide-tab-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.guide-tab-item{background:var(--stamp);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--ink);font-weight:600;}
.budget-diff.ok{color:var(--green);font-size:11px;font-weight:700;margin-top:4px;text-align:right;}
.budget-diff.over{color:#ef4444;font-size:11px;font-weight:700;margin-top:4px;text-align:right;}
.hero{background:var(--paper);padding:10px 18px;border-bottom:1px solid var(--border);}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.hero-meta span{font-size:12px;color:var(--muted);}
.hero-meta .pill{color:#fff !important;}
</style>
</head>

var rateCache={rate:null,base:null,ts:0};

async function getRate(code){
  if(code==="JPY")return{rate:1,symbol:"¥"};
  var now=Date.now();
  if(rateCache.base===code&&rateCache.rate&&(now-rateCache.ts)<3600000){
    return{rate:rateCache.rate,symbol:(CURRENCIES.find(function(c){return c.code===code;})||{symbol:code}).symbol};
  }
  var sym=(CURRENCIES.find(function(c){return c.code===code;})||{symbol:code}).symbol;
  // Try multiple APIs
  var apis=[
    "https://open.er-api.com/v6/latest/JPY",
    "https://api.exchangerate-api.com/v4/latest/JPY"
  ];
  for(var i=0;i<apis.length;i++){
    try{
      var r=await fetch(apis[i]);
      var d=await r.json();
      var rates=d.rates||d.conversion_rates;
      if(rates&&rates[code]){
        var rate=1/rates[code];
        rateCache={rate:rate,base:code,ts:now};
        return{rate:rate,symbol:sym};
      }
    }catch(e){console.warn("rate api failed:",apis[i],e);}
  }
  return{rate:null,symbol:sym};
}

async function fetchWeather(lat,lng,startDate,endDate){
  var cacheKey=lat+","+lng+","+startDate+","+endDate;
  if(weatherCache[cacheKey])return weatherCache[cacheKey];
  try{
    var start=startDate||new Date().toISOString().slice(0,10);
    var end=endDate||start;
    // Limit to 16 days forecast
    var url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lng+
      "&daily=weathercode,temperature_2m_max,temperature_2m_min"+
      "&timezone=auto&start_date="+start+"&end_date="+end;
    var r=await fetch(url);
    var d=await r.json();
    if(d.daily){weatherCache[cacheKey]=d.daily;return d.daily;}
  }catch(e){console.warn("weather err:",e);}
  return null;
}

function renderWeather(sel){
  var cities=sel.weatherCities||[];
  var d=ce("div","weather-section");

  // Add city row
  var addRow=ce("div","weather-city-row");
  var inp=ce("input","inp",{placeholder:"都市名を入力（例：ソウル）",value:weatherCityInput,
    oninput:function(e){weatherCityInput=e.target.value;},
    onkeydown:function(e){if(e.key==="Enter")addWeatherCity(sel.id,cities);}
  });
  var addBtn=ce("button","plus-btn",{onclick:function(){addWeatherCity(sel.id,cities);}});
  ap(addBtn,tx("＋"));ap(addRow,inp,addBtn);ap(d,addRow);

  if(cities.length===0){
    ap(d,ap(ce("div","weather-loading"),tx("都市を追加すると天気予報が表示されます")));
    return d;
  }

  // Render each city
  cities.forEach(function(city,idx){
    var card=ce("div","weather-card");
    var hdr=ce("div","weather-card-header");
    ap(hdr,ap(ce("div","weather-city-name"),tx("📍 "+city.name)));
    var rmBtn=ce("button","",{style:{background:"none",border:"none",color:"var(--muted)",fontSize:"13px",cursor:"pointer"},
      onclick:function(){removeWeatherCity(sel.id,cities,idx);}});
    ap(rmBtn,tx("✕"));ap(hdr,rmBtn);ap(card,hdr);

    var daysEl=ce("div","weather-days");
    ap(daysEl,ap(ce("div","weather-loading"),tx("取得中...")));
    ap(card,daysEl);ap(d,card);

    // Async fetch weather
    (function(cityObj,el,tripStartDate,tripEndDate){
      var today=new Date().toISOString().slice(0,10);
      var start=tripStartDate||today;
      var end=tripEndDate||start;
      // Clamp to today + 15 days max
      var maxEnd=new Date();maxEnd.setDate(maxEnd.getDate()+15);
      var maxEndStr=maxEnd.toISOString().slice(0,10);
      if(end>maxEndStr)end=maxEndStr;
      if(start<today)start=today;
      if(start>end)start=end;

      fetchWeather(cityObj.lat,cityObj.lng,start,end).then(function(data){
        el.innerHTML="";
        if(!data||!data.time||data.time.length===0){
          ap(el,ap(ce("div","weather-err"),tx("予報データなし")));return;
        }
        data.time.forEach(function(dateStr,i){
          var dt=new Date(dateStr+"T00:00:00");
          var dow="日月火水木金土"[dt.getDay()];
          var mmdd=(dt.getMonth()+1)+"/"+(dt.getDate());
          var icon=getWeatherIcon(data.weathercode[i]);
          var tmax=Math.round(data.temperature_2m_max[i]);
          var tmin=Math.round(data.temperature_2m_min[i]);
          var day=ce("div","weather-day");
          ap(day,ap(ce("div","weather-day-date"),tx(mmdd+"("+dow+")")));
          ap(day,ap(ce("div","weather-day-icon"),tx(icon)));
          var temp=ce("div","weather-day-temp");
          ap(temp,tx(tmax+"°"));ap(temp,ap(ce("span",""),tx("/"+tmin+"°")));
          ap(day,temp);ap(el,day);
        });
      });
    })(city,daysEl,sel.startDate,sel.endDate);
  });

  return d;
}


function renderBudget(sel){
  var budget=sel.budget||[];
  var currency=sel.currency||"JPY";
  var curObj=CURRENCIES.find(function(c){return c.code===currency;})||{code:"JPY",symbol:"¥",name:"日本円",flag:"🇯🇵"};
  var sym=curObj.symbol;
  var totalB=budget.reduce(function(s,b){return s+(parseInt(b.budget)||0);},0);
  var totalA=budget.reduce(function(s,b){return s+(parseInt(b.actual)||0);},0);
  var remaining=totalB-totalA;
  var pct=totalB>0?Math.min(Math.round(totalA/totalB*100),100):0;
  var over=totalA>totalB&&totalB>0;
  var d=ce("div","content");

  // Currency selector - dropdown
  var csec=ce("div","",{style:{marginBottom:"12px"}});
  var selRow=ce("div","",{style:{display:"flex",alignItems:"center",gap:"10px"}});
  ap(selRow,ap(ce("div","",{style:{fontSize:"13px",fontWeight:"700",color:"var(--muted)"}}),tx("通貨")));
  var sel2=ce("select","",{style:{flex:"1",padding:"10px 12px",border:"1.5px solid var(--border)",borderRadius:"10px",fontSize:"14px",color:"var(--ink)",background:"var(--paper)",fontFamily:"inherit",outline:"none"}});
  CURRENCIES.forEach(function(c){
    var opt=document.createElement("option");
    opt.value=c.code;
    opt.textContent=c.flag+" "+c.code+" - "+c.name;
    if(c.code===currency)opt.selected=true;
    sel2.appendChild(opt);
  });
  sel2.onchange=async function(){
    await db.collection("trips").doc(sel.id).update({currency:sel2.value});
    render();
  };
  ap(selRow,sel2);
  ap(csec,selRow);

  // Rate info
  var rateEl=ce("div","",{id:"rate-info",style:{fontSize:"12px",color:"var(--muted)",marginTop:"6px",minHeight:"16px"}});
  ap(csec,rateEl);
  if(currency!=="JPY"){
    getRate(currency).then(function(res){
      var el=document.getElementById("rate-info");
      if(!el)return;
      if(res.rate)el.textContent="📈 1"+sym+"＝約"+res.rate.toFixed(2)+"円（リアルタイム）";
      else el.textContent="⚠️ レート取得失敗";
    });
  }
  ap(d,csec);

  // Summary
  var sum=ce("div","budget-summary");
  ap(sum,ap(ce("div","",{style:{fontSize:"11px",color:"rgba(255,255,255,0.5)",marginBottom:"8px",letterSpacing:"1px",textTransform:"uppercase"}}),tx("💰 予算サマリー（"+currency+"）")));
  var tr=ce("div","",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:"10px"}});
  var tl=ce("div","");ap(tl,ap(ce("div","",{style:{fontSize:"13px",color:"rgba(255,255,255,0.6)"}}),tx("支出合計")),ap(ce("div","",{style:{fontSize:"26px",fontWeight:"800",color:over?"#f87171":"#fff"}}),tx(sym+Number(totalA).toLocaleString())));
  var tr2=ce("div","",{style:{textAlign:"right"}});ap(tr2,ap(ce("div","",{style:{fontSize:"13px",color:"rgba(255,255,255,0.6)"}}),tx("予算")),ap(ce("div","",{style:{fontSize:"16px",fontWeight:"700",color:"rgba(255,255,255,0.8)"}}),tx(sym+Number(totalB).toLocaleString())));
  ap(tr,tl,tr2);ap(sum,tr);
  ap(sum,ap(ce("div","budget-prog-bg"),ap(ce("div","budget-prog-fill",{style:{width:pct+"%",background:over?"#f87171":"#4ade80"}}))));
  ap(sum,ap(ce("div","",{style:{display:"flex",justifyContent:"space-between",fontSize:"11px",color:"rgba(255,255,255,0.5)"}}),ap(ce("span",""),tx("使用率 "+pct+"%")),ap(ce("span","",{style:{color:over?"#f87171":"rgba(255,255,255,0.6)"}}),tx((over?"超過 "+sym:"残り "+sym)+Number(Math.abs(remaining)).toLocaleString()))));
  // JPY equivalent of total actual
  if(currency!=="JPY"){
    var jpyEl=ce("div","",{id:"jpy-total",style:{fontSize:"12px",color:"rgba(255,255,255,0.5)",marginTop:"6px"}});
    ap(jpyEl,tx("円換算を計算中..."));
    ap(sum,jpyEl);
    getRate(currency).then(function(res){
      var el=document.getElementById("jpy-total");
      if(!el)return;
      if(res.rate){
        var jpyA=Math.round(totalA*res.rate);
        var jpyB=Math.round(totalB*res.rate);
        el.textContent="≈ 支出 ¥"+jpyA.toLocaleString()+" ／ 予算 ¥"+jpyB.toLocaleString();
      }else{el.textContent="";}
    });
  }
  ap(d,sum);

  // Items
  budget.forEach(function(item,idx){
    var card=ce("div","budget-item");
    var top=ce("div","",{style:{display:"flex",alignItems:"center",gap:"8px"}});
    ap(top,ap(ce("div","",{style:{fontSize:"18px",flexShrink:"0"}}),tx(item.icon||"💰")),ap(ce("div","",{style:{flex:"1",fontSize:"14px",fontWeight:"700",color:"var(--ink)"}}),tx(item.name)));
    var del=ce("button","",{style:{background:"none",border:"none",color:"var(--border)",fontSize:"14px",cursor:"pointer"},onclick:function(){delBudgetItem(idx);}});ap(del,tx("✕"));ap(top,del);
    ap(card,top);
    var inputs=ce("div","budget-inputs");
    var bw=ce("div","budget-inp-wrap");ap(bw,ap(ce("div","budget-inp-label"),tx("予算（"+sym+"）")));
    var bi=ce("input","budget-inp",{type:"number",value:item.budget||"",placeholder:"0"});
    bi.onblur=function(e){updateBudgetField(idx,"budget",e.target.value);};ap(bw,bi);
    var aw=ce("div","budget-inp-wrap");ap(aw,ap(ce("div","budget-inp-label"),tx("実績（"+sym+"）")));
    var ai=ce("input","budget-inp",{type:"number",value:item.actual||"",placeholder:"0"});
    ai.onblur=function(e){updateBudgetField(idx,"actual",e.target.value);};ap(aw,ai);
    ap(inputs,bw,aw);ap(card,inputs);
    var diff=(parseInt(item.budget)||0)-(parseInt(item.actual)||0);
    ap(card,ap(ce("div",diff>=0?"budget-diff ok":"budget-diff over"),tx(diff>=0?"残り "+sym+Number(diff).toLocaleString():"超過 "+sym+Number(Math.abs(diff)).toLocaleString())));
    ap(d,card);
  });

  var addBtn=ce("button","",{style:{width:"100%",padding:"13px",background:"var(--stamp)",border:"1.5px dashed var(--border)",borderRadius:"11px",fontSize:"14px",color:"var(--muted)",cursor:"pointer",fontFamily:"inherit",marginTop:"4px"},onclick:function(){showNewBudget=true;render();}});
  ap(addBtn,tx("＋ カテゴリを追加"));ap(d,addBtn);
  return d;
}

function renderModal_guide(){
  var ov=ce("div","overlay",{onclick:function(e){if(e.target===ov){showGuide=false;render();}}});
  var modal=ce("div","guide-modal",{onclick:function(e){e.stopPropagation();}});
  ap(modal,ce("div","modal-bar"));
  ap(modal,ap(ce("div","",{style:{fontSize:"18px",fontWeight:"800",color:"#1c1917",marginBottom:"20px"}}),tx("たびノートの使い方")));

  var steps=[
    {title:"旅行を作成する",desc:"右上の「＋ 追加」から旅行を登録。国内・海外を選ぶとテンプレートが自動で追加されます。"},
    {title:"各タブで旅を管理する",desc:"旅行カードをタップすると詳細画面へ。6つのタブで旅行情報を管理できます。",tabs:["🗓 行程","🎒 持ち物","✅ ToDo","📍 スポット","💰 予算","🌤 天気"]},
    {title:"行程を記録する",desc:"日付・時刻・内容を入力して旅程を登録。日付ごとにまとめて表示されます。"},
    {title:"予算を管理する",desc:"39カ国の通貨に対応。リアルタイム為替レートで円換算も自動表示されます。"},
    {title:"天気を確認する",desc:"天気タブで都市を追加すると、旅行期間中の天気予報と最高・最低気温が表示されます。"},
    {title:"旅行を共有する",desc:"🔗ボタンから閲覧リンクを発行（ログイン不要）、またはメールアドレスで編集メンバーを招待できます。"},
  ];

  steps.forEach(function(s,i){
    var step=ce("div","guide-step");
    var num=ce("div","guide-step-num");ap(num,tx(String(i+1)));
    var body=ce("div","guide-step-body");
    ap(body,ap(ce("div","guide-step-title"),tx(s.title)));

}).catch(function(e){
